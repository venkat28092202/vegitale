version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vegitale
      POSTGRES_PASSWORD: vegitale
      POSTGRES_DB: vegitale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://vegitale:vegitale@db:5432/vegitale
      JWT_SECRET: change-this-in-production
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"

volumes:
  pgdata:
